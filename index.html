<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safelink Bypass Tool</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --primary: #3b82f6; --primary-hover: #2563eb; --success: #10b981; --error: #ef4444; --error-bg: #fef2f2; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --primary: #3b82f6; --primary-hover: #60a5fa; --error-bg: #451a1a; } }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 540px; background: var(--card); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .header p { font-size: 14px; color: var(--text-muted); }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input[type="url"] { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; outline: none; }
        input[type="url"]:focus { border-color: var(--primary); }
        button { padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-success { background: var(--success); color: #fff; text-decoration: none; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-size: 13px; }
        .loader { display: none; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-card { display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 20px; }
        .link-box { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 16px; gap: 10px; }
        .link-text { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .error-box { display: none; background: var(--error-bg); border: 1px solid rgba(239,68,68,0.3); color: var(--error); padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>Safelink Bypass</h1><p>Ekstrak tautan asli dengan cepat.</p></div>
        <div id="error-box" class="error-box"></div>
        <div class="input-group">
            <input type="url" id="url-input" placeholder="Paste URL safelink di sini...">
            <button id="btn-generate" class="btn-primary" onclick="processLink()">
                <span id="btn-text">Buka Link</span>
                <div class="loader" id="loading-spinner"></div>
            </button>
        </div>
        <div id="result" class="result-card">
            <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-muted);">LINK UTAMA</div>
            <div class="link-box">
                <span id="result-url" class="link-text"></span>
                <button class="btn-outline" onclick="copyLink()" id="btn-copy">Copy</button>
            </div>
            <a id="btn-open" href="#" target="_blank" class="btn-success">Buka Tujuan Asli</a>
        </div>
    </div>
    <script>
        const urlInput = document.getElementById('url-input');
        const btnGen = document.getElementById('btn-generate');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('loading-spinner');
        const resultCard = document.getElementById('result');
        const resultUrl = document.getElementById('result-url');
        const btnOpen = document.getElementById('btn-open');
        const errorBox = document.getElementById('error-box');

        function setLoading(isLoading) {
            btnGen.disabled = isLoading;
            btnText.innerText = isLoading ? 'Memproses...' : 'Buka Link';
            spinner.style.display = isLoading ? 'block' : 'none';
            if(isLoading) { resultCard.style.display = 'none'; errorBox.style.display = 'none'; }
        }
        function showError(msg) { errorBox.innerText = msg; errorBox.style.display = 'block'; resultCard.style.display = 'none'; }

        async function processLink() {
            const rawUrl = urlInput.value.trim();
            if (!rawUrl) return showError("URL tidak boleh kosong.");
            try { new URL(rawUrl); } catch (e) { return showError("Format URL tidak valid."); }

            setLoading(true);
            
            // Panggil backend Vercel kita
            try {
                const res = await fetch(`/api/extract?url=${encodeURIComponent(rawUrl)}`);
                const data = await res.json();

                if (data.success && data.url) {
                    resultUrl.innerText = data.url;
                    btnOpen.href = data.url;
                    resultCard.style.display = 'block';
                } else {
                    showError(data.error || "Gagal mengekstrak link.");
                }
            } catch (e) {
                showError("Gagal konek ke server API. Cek koneksi lo.");
            } finally {
                setLoading(false);
            }
        }
        function copyLink() {
            navigator.clipboard.writeText(resultUrl.innerText).then(() => {
                const b = document.getElementById('btn-copy');
                b.innerText = 'Copied!'; setTimeout(() => b.innerText = 'Copy', 2000);
            });
        }
        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processLink(); });
    </script>
</body>
</html>
